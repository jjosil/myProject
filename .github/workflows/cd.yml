name: CD Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: action/checkout@v4

      - name: Build Docker Image
        run: docker build -t myapp:${{ github.sha }} .
      
      - name: Simulate Deployment
        run: echo "Deploying myapp:${{ github.sha }} to production environment..."

      - name: Notify Deployment Success
        run: echo "Deployment of myapp:${{ github.sha }} successful!"