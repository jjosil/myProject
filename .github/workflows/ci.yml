name: CI Pipeline

run-name: CI Pipeline

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Ensure jest is executable (safety fix)
        run: chmod +x node_modules/.bin/jest || true

      - name: Run tests
        run: npx jest